services:
  propiedad-service:
   build: .
   container_name: microservicio-propiedad
   restart: always
   network_mode: "host"
   environment:
    - DB_HOST=127.0.0.1
    - DB_PORT=${DB_PORT}
    - DB_NAME=${DB_NAME}
    - DB_USER=${DB_USER}
    - DB_PASSWORD=${DB_PASSWORD}
   ports:
    - "8081:8081"
